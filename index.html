<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Visual Novel</title>
  <link rel="stylesheet" href="style.css?v=start1">
</head>
<body>

  <!-- Outermost wrapper: fills viewport, black background -->
  <div id="game-wrapper">

    <!-- 16:9 game area, centered -->
    <div id="game-canvas">

      <!-- Pure white borders (top, bottom, left, right) -->
      <div id="border-top">
        <!-- Toolbar lives inside the top border -->
        <nav id="toolbar" aria-label="Game toolbar">
          <button type="button" class="toolbar-btn">BACK</button>
          <span class="toolbar-divider">|</span>
          <button type="button" class="toolbar-btn">LOG</button>
          <span class="toolbar-divider">|</span>
          <button type="button" class="toolbar-btn">PROGRESS</button>
          <span class="toolbar-divider">|</span>
          <button type="button" class="toolbar-btn">SKIP</button>
          <span class="toolbar-divider">|</span>
          <button type="button" class="toolbar-btn">AUTO</button>
          <span class="toolbar-divider">|</span>
          <button type="button" class="toolbar-btn">SAVE</button>
          <span class="toolbar-divider">|</span>
          <button type="button" class="toolbar-btn">LOAD</button>
          <span class="toolbar-divider">|</span>
          <button type="button" class="toolbar-btn">SETTINGS</button>
        </nav>
      </div>
      <div id="border-bottom"></div>
      <div id="border-left"></div>
      <div id="border-right"></div>

      <!-- Inner area inside the borders -->
      <div id="game-content">

        <!-- Background image layer (text placeholder until art assets exist) -->
        <div id="background-layer">
          <div id="background-label" aria-hidden="true"></div>
        </div>

        <!-- Character sprite layer -->
        <div id="character-layer">
          <div id="character-sprite" aria-hidden="true">
            <img id="character-sprite-img" alt="" hidden>
            <span id="character-sprite-label"></span>
          </div>
        </div>

        <!-- UI layer: dialogue box -->
        <div id="ui-layer">
          <div id="dialogue-box">
            <div id="story-objective" hidden></div>
            <div id="character-name">[NAME]</div>
            <div id="dialogue-text"></div>
            <div id="mode-hint" hidden></div>
            <div id="interrupt-bar" hidden>
              <span id="interrupt-count">Interrupt ×5</span>
              <button type="button" id="interrupt-btn">Interrupt</button>
            </div>
            <button type="button" id="toggle-suggestions-btn" hidden aria-expanded="false">Show quick actions</button>
            <div id="suggestion-chips" hidden></div>
            <div id="player-input-area">
              <input
                type="text"
                id="player-input"
                placeholder="Type your reply…"
                autocomplete="off"
              >
              <button type="button" id="send-btn">Send</button>
            </div>
            <button type="button" id="advance-mainline-btn" hidden>Continue story →</button>
          </div>
        </div>

      </div><!-- /#game-content -->

      <!-- Title / start gate — click unlocks browser audio autoplay -->
      <div id="start-screen" role="dialog" aria-modal="true" aria-labelledby="start-title">
        <div class="start-screen-inner">
          <p class="start-kicker">Paul Project</p>
          <h1 id="start-title">Visual Novel</h1>
          <p class="start-tagline">A wasteland road trip. Limited speech. Choices that stick.</p>
          <button type="button" id="start-game-btn">Start Game</button>
          <p class="start-hint">Click to begin — browsers block sound until you interact.</p>
        </div>
      </div>

    </div><!-- /#game-canvas -->

  </div><!-- /#game-wrapper -->

  <script src="auth.js?v=phaseA"></script>
  <script src="audio.js?v=blob1"></script>
  <script src="ai.js?v=slim1"></script>
  <script src="main.js?v=blob2"></script>
</body>
</html>
