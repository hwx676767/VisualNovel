<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Visual Novel</title>
  <link rel="stylesheet" href="style.css?v=ui27">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=Special+Elite&family=IBM+Plex+Sans:ital,wght@0,500;0,700;1,700&display=swap" rel="stylesheet">
</head>
<body>

  <div id="game-wrapper">
    <div id="game-canvas" class="ui-scrapbook">

      <!-- TOP: photo stage only -->
      <div id="layout-top">
        <div id="scrapbook-matte" aria-hidden="true">
          <span class="matte matte-red"></span>
          <span class="matte matte-orange"></span>
          <span class="matte matte-green"></span>
          <span class="matte matte-blue"></span>
        </div>

        <div id="stage-frame">
          <div id="stage-layer">
            <div id="background-layer">
              <div id="background-label" aria-hidden="true"></div>
            </div>

            <div id="character-layer">
              <div id="character-sprite" aria-hidden="true">
                <img id="character-sprite-img" alt="" hidden>
                <span id="character-sprite-label"></span>
              </div>
            </div>

            <div id="atmosphere-layer" aria-hidden="true"></div>
          </div>
        </div>
      </div>

      <!-- BOTTOM: fixed notepad (native aspect, font shrinks to fit) -->
      <div id="layout-bottom">
        <div id="ui-layer">
          <div id="dialogue-box" class="notepad-box">
            <img class="notepad-art" src="ui/notepad.png" alt="" draggable="false">
            <div id="notepad-inner">
              <div id="story-objective" hidden></div>
              <div id="character-name">[NAME]</div>
              <div id="dialogue-text"></div>
              <div id="click-continue" hidden>(Click to continue)</div>
              <div id="mode-hint" hidden></div>
              <div id="interrupt-bar" hidden>
                <span id="interrupt-count">Interrupt ×5</span>
                <button type="button" id="interrupt-btn">Interrupt</button>
              </div>
              <button type="button" id="toggle-suggestions-btn" hidden aria-expanded="false">▸ Show choices</button>
              <div id="suggestion-chips" class="is-collapsed" hidden></div>
              <div id="dialogue-action-row">
                <button type="button" id="advance-mainline-btn" hidden>Continue →</button>
                <div id="player-input-area">
                  <input
                    type="text"
                    id="player-input"
                    placeholder="Type your reply…"
                    autocomplete="off"
                  >
                  <button type="button" id="send-btn">Send</button>
                </div>
              </div>
            </div>
          </div>
        </div>
      </div>

      <!-- Handheld: closed by default, open on hover -->
      <div id="handheld-dock" title="Hover to open device">
        <img id="handheld-closed" class="handheld-closed" src="ui/handheld_closed.png" alt="">

        <div id="handheld-open" class="handheld-open" role="toolbar" aria-label="Game device">
          <div class="handheld-frame">
            <img class="handheld-shell" src="ui/handheld.png" alt="">
            <div class="handheld-screen">
              <div id="handheld-hearts" aria-label="Lives">
                <img class="heart is-full" src="ui/heart.png" alt="">
                <img class="heart is-full" src="ui/heart.png" alt="">
                <img class="heart is-full" src="ui/heart.png" alt="">
              </div>

              <button type="button" class="handheld-slot slot-interrupt" data-action="interrupt" aria-label="Interrupt">
                <img src="ui/icon_interrupt.png" alt="">
                <span id="handheld-interrupt-count" class="pixel-count">5</span>
              </button>

              <button type="button" class="handheld-slot slot-log" data-action="log" aria-label="Log">
                <img src="ui/icon_log.png" alt="">
              </button>

              <button type="button" class="handheld-slot slot-settings" data-action="settings" aria-label="Settings">
                <img src="ui/icon_settings.png" alt="">
              </button>

              <img id="handheld-selector" src="ui/selector.png" alt="" hidden>
            </div>
          </div>
        </div>
      </div>

      <div id="start-screen" role="dialog" aria-modal="true" aria-labelledby="start-title">
        <div class="start-screen-inner">
          <p class="start-kicker">Paul Project</p>
          <h1 id="start-title">Visual Novel</h1>
          <p class="start-tagline">A wasteland road trip. Limited speech. Choices that stick.</p>
          <button type="button" id="start-game-btn">Start Game</button>
          <p class="start-hint">Click to begin — browsers block sound until you interact.</p>
        </div>
      </div>

    </div><!-- /#game-canvas -->
  </div><!-- /#game-wrapper -->

  <script src="auth.js?v=phaseA"></script>
  <script src="audio.js?v=blob1"></script>
  <script src="ai.js?v=slim1"></script>
  <script src="main.js?v=ui27"></script>
</body>
</html>
